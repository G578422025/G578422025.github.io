
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>佐藤優稀 | Portfolio</title>
  <style>
    /* ページ全体の基本設定 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #071426;
      color: #f1f5f9;
      line-height: 1.8;
    }

    /* ヘッダー部分 */
    header {
      padding: 24px 8%;
      background: #0c203b;
      border-bottom: 1px solid #2563a6;
    }

    header h1 {
      margin: 0;
      color: #60a5fa;
      letter-spacing: 3px;
    }

    /* メインビジュアル */
    .hero {
      padding: 90px 8%;
      background: linear-gradient(135deg, #102c50, #071426);
      text-align: center;
    }

    .hero p {
      color: #93c5fd;
      letter-spacing: 4px;
    }

    .hero h2 {
      font-size: 42px;
      margin: 10px 0;
    }

    /* コンテンツ全体 */
    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    /* 各プロフィールセクション */
    section {
      background: #10243d;
      margin-bottom: 24px;
      padding: 28px;
      border-left: 4px solid #3b82f6;
      border-radius: 8px;
    }

    section h2 {
      color: #60a5fa;
      margin-top: 0;
    }

    /* フッター部分 */
    footer {
      text-align: center;
      padding: 25px;
      color: #94a3b8;
      background: #0c203b;
    }

    /* スマートフォン向けの表示設定 */
    @media (max-width: 600px) {
      .hero {
        padding: 60px 20px;
      }

      .hero h2 {
        font-size: 30px;
      }

      section {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <!-- ヘッダー -->
  <header>
    <h1>MY PORTFOLIO</h1>
  </header>

  <!-- メインビジュアル -->
  <div class="hero">
    <p>WELCOME TO MY PORTFOLIO</p>
    <h2>佐藤 優稀</h2>
    <p>サッカー好きです</p>
  </div>

  <!-- プロフィール内容 -->
  <main>
    <section>
      <h2>PROFILE</h2>
      <p>名前：佐藤優稀</p>
      <p>学年：4年</p>
      <p>所属：工学部</p>
    </section>

    <section>
      <h2>HOBBY</h2>
      <p>趣味・好きなこと：読書</p>
      <p>サッカーが好きです。</p>
    </section>

    <section>
      <h2>PROGRAMMING</h2>
      <p>授業でJavaを勉強しています。</p>
    </section>

    <section>
      <h2>LEARNING</h2>
      <p>この授業で色々なことを学びたいです。</p>
    </section>

    <section>
      <h2>MESSAGE</h2>
      <p>よろしくお願いします。</p>
    </section>
  </main>

  <!-- フッター -->
  <footer>
    <p>MY PORTFOLIO</p>
  </footer>
</body>
</html>
